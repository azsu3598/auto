[project]
name = "stock-automation"
version = "0.1.0"
description = "Scheduled Korean closing-bet analysis and simulated execution engine"
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.35.0",
]

[project.scripts]
stock-automation = "stock_automation.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stock_automation"]

[tool.hatch.build.targets.wheel.force-include]
"src/stock_automation/dashboard_static" = "stock_automation/dashboard_static"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
