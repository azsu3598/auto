{
  "AWSTemplateFormatVersion": "2010-09-09",
  "Description": "Authenticated HTTPS mobile viewer of the paper ledger; no orders or trading schedule changes",
  "Parameters": {
    "ArtifactBucketName": {
      "Type": "String"
    },
    "ApiCodeKey": {
      "Type": "String",
      "AllowedPattern": "config/web/[a-f0-9]{64}\\.zip"
    },
    "PaperTableName": {
      "Type": "String",
      "Default": "stock-automation-paper",
      "AllowedValues": [
        "stock-automation-paper"
      ]
    },
    "LoginDomainPrefix": {
      "Type": "String",
      "AllowedPattern": "sabu-paper-[a-f0-9]{12}"
    },
    "OperatorUserName": {
      "Type": "String",
      "Default": "stock-paper-operator",
      "AllowedValues": [
        "stock-paper-operator"
      ]
    },
    "PaperWalletEpoch": {
      "Type": "String",
      "Default": "",
      "AllowedPattern": "[A-Za-z0-9_-]{0,40}"
    }
  },
  "Resources": {
    "WebBucket": {
      "Type": "AWS::S3::Bucket",
      "DeletionPolicy": "Retain",
      "UpdateReplacePolicy": "Retain",
      "Properties": {
        "PublicAccessBlockConfiguration": {
          "BlockPublicAcls": true,
          "BlockPublicPolicy": true,
          "IgnorePublicAcls": true,
          "RestrictPublicBuckets": true
        },
        "OwnershipControls": {
          "Rules": [
            {
              "ObjectOwnership": "BucketOwnerEnforced"
            }
          ]
        },
        "BucketEncryption": {
          "ServerSideEncryptionConfiguration": [
            {
              "ServerSideEncryptionByDefault": {
                "SSEAlgorithm": "AES256"
              }
            }
          ]
        }
      }
    },
    "OriginAccess": {
      "Type": "AWS::CloudFront::OriginAccessControl",
      "Properties": {
        "OriginAccessControlConfig": {
          "Name": "stock-paper-dashboard-origin",
          "OriginAccessControlOriginType": "s3",
          "SigningBehavior": "always",
          "SigningProtocol": "sigv4"
        }
      }
    },
    "StaticCache": {
      "Type": "AWS::CloudFront::CachePolicy",
      "Properties": {
        "CachePolicyConfig": {
          "Name": "stock-paper-dashboard-static",
          "DefaultTTL": 60,
          "MinTTL": 0,
          "MaxTTL": 3600,
          "ParametersInCacheKeyAndForwardedToOrigin": {
            "CookiesConfig": {
              "CookieBehavior": "none"
            },
            "HeadersConfig": {
              "HeaderBehavior": "none"
            },
            "QueryStringsConfig": {
              "QueryStringBehavior": "none"
            },
            "EnableAcceptEncodingGzip": true,
            "EnableAcceptEncodingBrotli": true
          }
        }
      }
    },
    "SecurityHeaders": {
      "Type": "AWS::CloudFront::ResponseHeadersPolicy",
      "Properties": {
        "ResponseHeadersPolicyConfig": {
          "Name": "stock-paper-dashboard-security",
          "SecurityHeadersConfig": {
            "ContentTypeOptions": {
              "Override": true
            },
            "FrameOptions": {
              "FrameOption": "DENY",
              "Override": true
            },
            "ReferrerPolicy": {
              "ReferrerPolicy": "no-referrer",
              "Override": true
            },
            "StrictTransportSecurity": {
              "AccessControlMaxAgeSec": 31536000,
              "IncludeSubdomains": false,
              "Preload": false,
              "Override": true
            },
            "ContentSecurityPolicy": {
              "Override": true,
              "ContentSecurityPolicy": {
                "Fn::Sub": "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' https://*.execute-api.${AWS::Region}.amazonaws.com https://*.auth.${AWS::Region}.amazoncognito.com; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self' https://*.auth.${AWS::Region}.amazoncognito.com"
              }
            }
          },
          "CustomHeadersConfig": {
            "Items": [
              {
                "Header": "Cache-Control",
                "Value": "no-store",
                "Override": true
              }
            ]
          }
        }
      }
    },
    "Distribution": {
      "Type": "AWS::CloudFront::Distribution",
      "Properties": {
        "DistributionConfig": {
          "Enabled": true,
          "DefaultRootObject": "index.html",
          "Comment": "SABU authenticated paper viewer",
          "PriceClass": "PriceClass_200",
          "HttpVersion": "http2",
          "IPV6Enabled": true,
          "Origins": [
            {
              "Id": "private-static",
              "DomainName": {
                "Fn::GetAtt": [
                  "WebBucket",
                  "RegionalDomainName"
                ]
              },
              "OriginAccessControlId": {
                "Ref": "OriginAccess"
              },
              "S3OriginConfig": {
                "OriginAccessIdentity": ""
              }
            }
          ],
          "DefaultCacheBehavior": {
            "TargetOriginId": "private-static",
            "ViewerProtocolPolicy": "redirect-to-https",
            "AllowedMethods": [
              "GET",
              "HEAD"
            ],
            "CachedMethods": [
              "GET",
              "HEAD"
            ],
            "Compress": true,
            "CachePolicyId": {
              "Ref": "StaticCache"
            },
            "ResponseHeadersPolicyId": {
              "Ref": "SecurityHeaders"
            }
          },
          "ViewerCertificate": {
            "CloudFrontDefaultCertificate": true,
            "MinimumProtocolVersion": "TLSv1.2_2021"
          }
        }
      }
    },
    "BucketPolicy": {
      "Type": "AWS::S3::BucketPolicy",
      "Properties": {
        "Bucket": {
          "Ref": "WebBucket"
        },
        "PolicyDocument": {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Principal": {
                "Service": "cloudfront.amazonaws.com"
              },
              "Action": "s3:GetObject",
              "Resource": {
                "Fn::Sub": "${WebBucket.Arn}/*"
              },
              "Condition": {
                "StringEquals": {
                  "AWS:SourceArn": {
                    "Fn::Sub": "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}"
                  }
                }
              }
            },
            {
              "Effect": "Deny",
              "Principal": "*",
              "Action": "s3:*",
              "Resource": [
                {
                  "Fn::GetAtt": [
                    "WebBucket",
                    "Arn"
                  ]
                },
                {
                  "Fn::Sub": "${WebBucket.Arn}/*"
                }
              ],
              "Condition": {
                "Bool": {
                  "aws:SecureTransport": false
                }
              }
            }
          ]
        }
      }
    },
    "UserPool": {
      "Type": "AWS::Cognito::UserPool",
      "DeletionPolicy": "Retain",
      "UpdateReplacePolicy": "Retain",
      "Properties": {
        "UserPoolName": "stock-paper-dashboard",
        "UserPoolTier": "LITE",
        "AdminCreateUserConfig": {
          "AllowAdminCreateUserOnly": true
        },
        "UsernameConfiguration": {
          "CaseSensitive": false
        },
        "MfaConfiguration": "OPTIONAL",
        "EnabledMfas": [
          "SOFTWARE_TOKEN_MFA"
        ],
        "AccountRecoverySetting": {
          "RecoveryMechanisms": [
            {
              "Name": "admin_only",
              "Priority": 1
            }
          ]
        },
        "Policies": {
          "PasswordPolicy": {
            "MinimumLength": 12,
            "RequireLowercase": true,
            "RequireUppercase": true,
            "RequireNumbers": true,
            "RequireSymbols": true,
            "TemporaryPasswordValidityDays": 3
          }
        }
      }
    },
    "LoginDomain": {
      "Type": "AWS::Cognito::UserPoolDomain",
      "Properties": {
        "Domain": {
          "Ref": "LoginDomainPrefix"
        },
        "UserPoolId": {
          "Ref": "UserPool"
        },
        "ManagedLoginVersion": 1
      }
    },
    "WebClient": {
      "Type": "AWS::Cognito::UserPoolClient",
      "Properties": {
        "ClientName": "sabu-mobile-read-only",
        "UserPoolId": {
          "Ref": "UserPool"
        },
        "GenerateSecret": false,
        "PreventUserExistenceErrors": "ENABLED",
        "AllowedOAuthFlowsUserPoolClient": true,
        "AllowedOAuthFlows": [
          "code"
        ],
        "AllowedOAuthScopes": [
          "openid"
        ],
        "SupportedIdentityProviders": [
          "COGNITO"
        ],
        "CallbackURLs": [
          {
            "Fn::Sub": "https://${Distribution.DomainName}/"
          }
        ],
        "LogoutURLs": [
          {
            "Fn::Sub": "https://${Distribution.DomainName}/"
          }
        ],
        "AccessTokenValidity": 5,
        "IdTokenValidity": 5,
        "RefreshTokenValidity": 1,
        "TokenValidityUnits": {
          "AccessToken": "minutes",
          "IdToken": "minutes",
          "RefreshToken": "days"
        },
        "EnableTokenRevocation": true
      }
    },
    "ReadBoundary": {
      "Type": "AWS::IAM::ManagedPolicy",
      "Properties": {
        "ManagedPolicyName": "StockPaperWebReadBoundary",
        "PolicyDocument": {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Action": [
                "dynamodb:Scan"
              ],
              "Resource": {
                "Fn::Sub": "arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${PaperTableName}"
              }
            },
            {
              "Effect": "Allow",
              "Action": [
                "logs:CreateLogStream",
                "logs:PutLogEvents"
              ],
              "Resource": {
                "Fn::Sub": "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/stock-paper-web-dashboard:*"
              }
            }
          ]
        }
      }
    },
    "ReadRole": {
      "Type": "AWS::IAM::Role",
      "Properties": {
        "RoleName": "stock-paper-web-reader",
        "Path": "/stock-paper/",
        "AssumeRolePolicyDocument": {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Principal": {
                "Service": "lambda.amazonaws.com"
              },
              "Action": "sts:AssumeRole"
            }
          ]
        },
        "PermissionsBoundary": {
          "Ref": "ReadBoundary"
        },
        "Policies": [
          {
            "PolicyName": "read-paper-ledger-only",
            "PolicyDocument": {
              "Version": "2012-10-17",
              "Statement": [
                {
                  "Effect": "Allow",
                  "Action": [
                    "dynamodb:Scan"
                  ],
                  "Resource": {
                    "Fn::Sub": "arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${PaperTableName}"
                  }
                },
                {
                  "Effect": "Allow",
                  "Action": [
                    "logs:CreateLogStream",
                    "logs:PutLogEvents"
                  ],
                  "Resource": {
                    "Fn::Sub": "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/stock-paper-web-dashboard:*"
                  }
                }
              ]
            }
          }
        ]
      }
    },
    "LogGroup": {
      "Type": "AWS::Logs::LogGroup",
      "Properties": {
        "LogGroupName": "/aws/lambda/stock-paper-web-dashboard",
        "RetentionInDays": 7
      }
    },
    "ApiFunction": {
      "Type": "AWS::Lambda::Function",
      "DependsOn": "LogGroup",
      "Properties": {
        "FunctionName": "stock-paper-web-dashboard",
        "Runtime": "python3.13",
        "Handler": "paper_web_api.handler",
        "MemorySize": 128,
        "Timeout": 15,
        "ReservedConcurrentExecutions": 2,
        "Role": {
          "Fn::GetAtt": [
            "ReadRole",
            "Arn"
          ]
        },
        "Code": {
          "S3Bucket": {
            "Ref": "ArtifactBucketName"
          },
          "S3Key": {
            "Ref": "ApiCodeKey"
          }
        },
        "Environment": {
          "Variables": {
            "PAPER_TABLE": {
              "Ref": "PaperTableName"
            },
            "LIVE_ORDER_ENABLED": "0",
            "PAPER_WALLET_EPOCH": {
              "Ref": "PaperWalletEpoch"
            },
            "CLIENT_ID": {
              "Ref": "WebClient"
            },
            "TOKEN_ISSUER": {
              "Fn::Sub": "https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}"
            }
          }
        }
      }
    },
    "HttpApi": {
      "Type": "AWS::ApiGatewayV2::Api",
      "Properties": {
        "Name": "stock-paper-web-read-only",
        "ProtocolType": "HTTP",
        "CorsConfiguration": {
          "AllowOrigins": [
            {
              "Fn::Sub": "https://${Distribution.DomainName}"
            }
          ],
          "AllowMethods": [
            "GET",
            "OPTIONS"
          ],
          "AllowHeaders": [
            "authorization"
          ],
          "MaxAge": 300
        }
      }
    },
    "Authorizer": {
      "Type": "AWS::ApiGatewayV2::Authorizer",
      "Properties": {
        "ApiId": {
          "Ref": "HttpApi"
        },
        "AuthorizerType": "JWT",
        "Name": "owner-sign-in",
        "IdentitySource": [
          "$request.header.Authorization"
        ],
        "JwtConfiguration": {
          "Audience": [
            {
              "Ref": "WebClient"
            }
          ],
          "Issuer": {
            "Fn::Sub": "https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}"
          }
        }
      }
    },
    "Integration": {
      "Type": "AWS::ApiGatewayV2::Integration",
      "Properties": {
        "ApiId": {
          "Ref": "HttpApi"
        },
        "IntegrationType": "AWS_PROXY",
        "IntegrationUri": {
          "Fn::GetAtt": [
            "ApiFunction",
            "Arn"
          ]
        },
        "PayloadFormatVersion": "2.0",
        "TimeoutInMillis": 15000
      }
    },
    "ReadRoute": {
      "Type": "AWS::ApiGatewayV2::Route",
      "Properties": {
        "ApiId": {
          "Ref": "HttpApi"
        },
        "RouteKey": "GET /api/dashboard",
        "AuthorizationType": "JWT",
        "AuthorizerId": {
          "Ref": "Authorizer"
        },
        "AuthorizationScopes": [
          "openid"
        ],
        "Target": {
          "Fn::Join": [
            "/",
            [
              "integrations",
              {
                "Ref": "Integration"
              }
            ]
          ]
        }
      }
    },
    "ApiStage": {
      "Type": "AWS::ApiGatewayV2::Stage",
      "DependsOn": "ReadRoute",
      "Properties": {
        "ApiId": {
          "Ref": "HttpApi"
        },
        "StageName": "$default",
        "AutoDeploy": true,
        "DefaultRouteSettings": {
          "ThrottlingBurstLimit": 5,
          "ThrottlingRateLimit": 2
        }
      }
    },
    "ApiPermission": {
      "Type": "AWS::Lambda::Permission",
      "Properties": {
        "Action": "lambda:InvokeFunction",
        "FunctionName": {
          "Ref": "ApiFunction"
        },
        "Principal": "apigateway.amazonaws.com",
        "SourceAccount": {
          "Ref": "AWS::AccountId"
        },
        "SourceArn": {
          "Fn::Sub": "arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*/GET/api/dashboard"
        }
      }
    },
    "OperatorWebPolicy": {
      "Type": "AWS::IAM::ManagedPolicy",
      "Properties": {
        "ManagedPolicyName": "StockPaperWebPublishAndReview",
        "Users": [
          {
            "Ref": "OperatorUserName"
          }
        ],
        "PolicyDocument": {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Action": [
                "cloudformation:DescribeStacks",
                "cloudformation:DescribeStackEvents",
                "cloudformation:DescribeStackResources",
                "cloudformation:GetTemplate"
              ],
              "Resource": {
                "Fn::Sub": "arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/stock-automation-paper-web/*"
              }
            },
            {
              "Effect": "Allow",
              "Action": [
                "s3:PutObject",
                "s3:GetObject"
              ],
              "Resource": {
                "Fn::Sub": "${WebBucket.Arn}/*"
              }
            },
            {
              "Effect": "Allow",
              "Action": [
                "s3:ListBucket"
              ],
              "Resource": {
                "Fn::GetAtt": [
                  "WebBucket",
                  "Arn"
                ]
              }
            },
            {
              "Effect": "Allow",
              "Action": [
                "cloudfront:GetDistribution",
                "cloudfront:CreateInvalidation",
                "cloudfront:GetInvalidation"
              ],
              "Resource": {
                "Fn::Sub": "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}"
              }
            },
            {
              "Effect": "Allow",
              "Action": [
                "lambda:GetFunction",
                "lambda:GetFunctionConfiguration"
              ],
              "Resource": {
                "Fn::GetAtt": [
                  "ApiFunction",
                  "Arn"
                ]
              }
            },
            {
              "Effect": "Allow",
              "Action": [
                "logs:DescribeLogStreams",
                "logs:GetLogEvents",
                "logs:FilterLogEvents"
              ],
              "Resource": {
                "Fn::Sub": "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/stock-paper-web-dashboard:*"
              }
            },
            {
              "Effect": "Allow",
              "Action": [
                "cognito-idp:DescribeUserPool",
                "cognito-idp:DescribeUserPoolClient"
              ],
              "Resource": {
                "Fn::GetAtt": [
                  "UserPool",
                  "Arn"
                ]
              }
            }
          ]
        }
      }
    }
  },
  "Outputs": {
    "DashboardUrl": {
      "Value": {
        "Fn::Sub": "https://${Distribution.DomainName}/"
      }
    },
    "ApiOrigin": {
      "Value": {
        "Fn::GetAtt": [
          "HttpApi",
          "ApiEndpoint"
        ]
      }
    },
    "StaticBucketName": {
      "Value": {
        "Ref": "WebBucket"
      }
    },
    "DistributionId": {
      "Value": {
        "Ref": "Distribution"
      }
    },
    "ClientId": {
      "Value": {
        "Ref": "WebClient"
      }
    },
    "UserPoolId": {
      "Value": {
        "Ref": "UserPool"
      }
    },
    "ApiFunctionArn": {
      "Value": {
        "Fn::GetAtt": [
          "ApiFunction",
          "Arn"
        ]
      }
    },
    "AuthOrigin": {
      "Value": {
        "Fn::Sub": "https://${LoginDomainPrefix}.auth.${AWS::Region}.amazoncognito.com"
      }
    }
  }
}
