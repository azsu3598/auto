{
  "AWSTemplateFormatVersion": "2010-09-09",
  "Description": "Admin bootstrap: bounded paper app deployment, no operator secret reads",
  "Parameters": {
    "OperatorUserName": {
      "Type": "String",
      "Default": "stock-paper-operator",
      "AllowedValues": [
        "stock-paper-operator"
      ]
    }
  },
  "Resources": {
    "ExecutionBoundary": {
      "Type": "AWS::IAM::ManagedPolicy",
      "Properties": {
        "ManagedPolicyName": "StockPaperAppExecutionBoundary",
        "PolicyDocument": {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Sid": "EcrToken",
              "Effect": "Allow",
              "Action": [
                "ecr:GetAuthorizationToken"
              ],
              "Resource": "*"
            },
            {
              "Sid": "OwnImage",
              "Effect": "Allow",
              "Action": [
                "ecr:BatchCheckLayerAvailability",
                "ecr:GetDownloadUrlForLayer",
                "ecr:BatchGetImage"
              ],
              "Resource": {
                "Fn::Sub": "arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/stock-automation"
              }
            },
            {
              "Sid": "OwnLogStreams",
              "Effect": "Allow",
              "Action": [
                "logs:CreateLogStream",
                "logs:PutLogEvents"
              ],
              "Resource": {
                "Fn::Sub": "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/stock-automation/paper:*"
              }
            },
            {
              "Sid": "OnlyDemoAndDart",
              "Effect": "Allow",
              "Action": [
                "secretsmanager:GetSecretValue"
              ],
              "Resource": [
                {
                  "Fn::Sub": "arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:stock-automation-paper/kiwoom-demo-??????"
                },
                {
                  "Fn::Sub": "arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:stock-automation-paper/dart-??????"
                }
              ]
            }
          ]
        }
      }
    },
    "TaskBoundary": {
      "Type": "AWS::IAM::ManagedPolicy",
      "Properties": {
        "ManagedPolicyName": "StockPaperAppTaskBoundary",
        "PolicyDocument": {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Sid": "PaperBucket",
              "Effect": "Allow",
              "Action": [
                "s3:ListBucket"
              ],
              "Resource": {
                "Fn::Sub": "arn:${AWS::Partition}:s3:::stock-automation-paper-${AWS::AccountId}-${AWS::Region}"
              }
            },
            {
              "Sid": "PaperObjects",
              "Effect": "Allow",
              "Action": [
                "s3:GetObject",
                "s3:PutObject"
              ],
              "Resource": {
                "Fn::Sub": "arn:${AWS::Partition}:s3:::stock-automation-paper-${AWS::AccountId}-${AWS::Region}/*"
              }
            },
            {
              "Sid": "PaperLedger",
              "Effect": "Allow",
              "Action": [
                "dynamodb:GetItem",
                "dynamodb:PutItem",
                "dynamodb:UpdateItem",
                "dynamodb:DeleteItem",
                "dynamodb:ConditionCheckItem",
                "dynamodb:Scan"
              ],
              "Resource": {
                "Fn::Sub": "arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/stock-automation-paper"
              }
            },
            {
              "Sid": "TelegramOnly",
              "Effect": "Allow",
              "Action": [
                "secretsmanager:GetSecretValue"
              ],
              "Resource": {
                "Fn::Sub": "arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:stock-automation-paper/telegram-??????"
              }
            },
            {
              "Sid": "PaperNotification",
              "Effect": "Allow",
              "Action": [
                "sns:Publish"
              ],
              "Resource": {
                "Fn::Sub": "arn:${AWS::Partition}:sns:${AWS::Region}:${AWS::AccountId}:stock-automation-paper"
              }
            },
            {
              "Sid": "InspectNatBootMetadata",
              "Effect": "Allow",
              "Action": [
                "ec2:DescribeInstances"
              ],
              "Resource": "*",
              "Condition": {
                "StringEquals": {
                  "aws:RequestedRegion": "ap-northeast-2"
                }
              }
            }
          ]
        }
      }
    },
    "SchedulerBoundary": {
      "Type": "AWS::IAM::ManagedPolicy",
      "Properties": {
        "ManagedPolicyName": "StockPaperAppSchedulerBoundary",
        "PolicyDocument": {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Sid": "OwnTask",
              "Effect": "Allow",
              "Action": [
                "ecs:RunTask"
              ],
              "Resource": {
                "Fn::Sub": "arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:task-definition/stock-automation-paper:*"
              },
              "Condition": {
                "ArnEquals": {
                  "ecs:cluster": {
                    "Fn::Sub": "arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:cluster/stock-automation-paper"
                  }
                }
              }
            },
            {
              "Sid": "OnlyBoundedEcsRoles",
              "Effect": "Allow",
              "Action": [
                "iam:PassRole"
              ],
              "Resource": [
                {
                  "Fn::Sub": "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/stock-paper/stock-paper-app-execution"
                },
                {
                  "Fn::Sub": "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/stock-paper/stock-paper-app-task"
                }
              ],
              "Condition": {
                "StringEquals": {
                  "iam:PassedToService": "ecs-tasks.amazonaws.com"
                }
              }
            }
          ]
        }
      }
    },
    "AppDeploymentRole": {
      "Type": "AWS::IAM::Role",
      "Properties": {
        "RoleName": "stock-paper-app-deployer",
        "AssumeRolePolicyDocument": {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Principal": {
                "Service": "cloudformation.amazonaws.com"
              },
              "Action": "sts:AssumeRole"
            }
          ]
        },
        "Policies": [
          {
            "PolicyName": "PaperAppDeploymentOnly",
            "PolicyDocument": {
              "Version": "2012-10-17",
              "Statement": [
                {
                  "Sid": "InspectNetwork",
                  "Effect": "Allow",
                  "Action": [
                    "ec2:DescribeSubnets",
                    "ec2:DescribeSecurityGroups",
                    "ec2:DescribeVpcs"
                  ],
                  "Resource": "*",
                  "Condition": {
                    "StringEquals": {
                      "aws:RequestedRegion": "ap-northeast-2"
                    }
                  }
                },
                {
                  "Sid": "PaperBucketControl",
                  "Effect": "Allow",
                  "Action": [
                    "s3:CreateBucket",
                    "s3:GetBucketLocation",
                    "s3:GetBucketTagging",
                    "s3:PutBucketTagging",
                    "s3:GetEncryptionConfiguration",
                    "s3:PutEncryptionConfiguration",
                    "s3:GetBucketPublicAccessBlock",
                    "s3:PutBucketPublicAccessBlock",
                    "s3:GetLifecycleConfiguration",
                    "s3:PutLifecycleConfiguration",
                    "s3:ListBucket"
                  ],
                  "Resource": {
                    "Fn::Sub": "arn:${AWS::Partition}:s3:::stock-automation-paper-${AWS::AccountId}-${AWS::Region}"
                  }
                },
                {
                  "Sid": "PaperTableControl",
                  "Effect": "Allow",
                  "Action": [
                    "dynamodb:CreateTable",
                    "dynamodb:DescribeTable",
                    "dynamodb:UpdateTable",
                    "dynamodb:DescribeContinuousBackups",
                    "dynamodb:UpdateContinuousBackups",
                    "dynamodb:DescribeTimeToLive",
                    "dynamodb:ListTagsOfResource",
                    "dynamodb:TagResource",
                    "dynamodb:UntagResource"
                  ],
                  "Resource": {
                    "Fn::Sub": "arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/stock-automation-paper"
                  }
                },
                {
                  "Sid": "PaperTopicControl",
                  "Effect": "Allow",
                  "Action": [
                    "sns:CreateTopic",
                    "sns:DeleteTopic",
                    "sns:GetTopicAttributes",
                    "sns:SetTopicAttributes",
                    "sns:TagResource",
                    "sns:UntagResource",
                    "sns:ListTagsForResource",
                    "sns:ListSubscriptionsByTopic"
                  ],
                  "Resource": {
                    "Fn::Sub": "arn:${AWS::Partition}:sns:${AWS::Region}:${AWS::AccountId}:stock-automation-paper"
                  }
                },
                {
                  "Sid": "OnlyEmailSubscription",
                  "Effect": "Allow",
                  "Action": [
                    "sns:Subscribe"
                  ],
                  "Resource": {
                    "Fn::Sub": "arn:${AWS::Partition}:sns:${AWS::Region}:${AWS::AccountId}:stock-automation-paper"
                  },
                  "Condition": {
                    "StringEquals": {
                      "sns:Protocol": "email"
                    }
                  }
                },
                {
                  "Sid": "OwnSubscription",
                  "Effect": "Allow",
                  "Action": [
                    "sns:GetSubscriptionAttributes",
                    "sns:SetSubscriptionAttributes",
                    "sns:Unsubscribe"
                  ],
                  "Resource": {
                    "Fn::Sub": "arn:${AWS::Partition}:sns:${AWS::Region}:${AWS::AccountId}:stock-automation-paper:*"
                  }
                },
                {
                  "Sid": "OwnCluster",
                  "Effect": "Allow",
                  "Action": [
                    "ecs:CreateCluster",
                    "ecs:DescribeClusters",
                    "ecs:DeleteCluster",
                    "ecs:UpdateClusterSettings",
                    "ecs:TagResource",
                    "ecs:UntagResource",
                    "ecs:ListTagsForResource"
                  ],
                  "Resource": {
                    "Fn::Sub": "arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:cluster/stock-automation-paper"
                  }
                },
                {
                  "Sid": "TaggedTaskRegistration",
                  "Effect": "Allow",
                  "Action": [
                    "ecs:RegisterTaskDefinition"
                  ],
                  "Resource": "*",
                  "Condition": {
                    "StringEquals": {
                      "aws:RequestedRegion": "ap-northeast-2",
                      "aws:RequestTag/Project": "stock-automation-paper"
                    }
                  }
                },
                {
                  "Sid": "OwnTaskDefinitions",
                  "Effect": "Allow",
                  "Action": [
                    "ecs:TagResource",
                    "ecs:UntagResource",
                    "ecs:ListTagsForResource"
                  ],
                  "Resource": {
                    "Fn::Sub": "arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:task-definition/stock-automation-paper:*"
                  }
                },
                {
                  "Sid": "InspectTaskDefinitionMetadata",
                  "Effect": "Allow",
                  "Action": [
                    "ecs:DescribeTaskDefinition"
                  ],
                  "Resource": "*",
                  "Condition": {
                    "StringEquals": {
                      "aws:RequestedRegion": "ap-northeast-2"
                    }
                  }
                },
                {
                  "Sid": "OwnLogs",
                  "Effect": "Allow",
                  "Action": [
                    "logs:CreateLogGroup",
                    "logs:DeleteLogGroup",
                    "logs:PutRetentionPolicy",
                    "logs:DeleteRetentionPolicy",
                    "logs:TagResource",
                    "logs:UntagResource",
                    "logs:ListTagsForResource",
                    "logs:TagLogGroup",
                    "logs:UntagLogGroup",
                    "logs:ListTagsLogGroup"
                  ],
                  "Resource": [
                    {
                      "Fn::Sub": "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/stock-automation/paper:*"
                    },
                    {
                      "Fn::Sub": "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/stock-automation/paper"
                    }
                  ]
                },
                {
                  "Sid": "InspectLogs",
                  "Effect": "Allow",
                  "Action": [
                    "logs:DescribeLogGroups"
                  ],
                  "Resource": "*",
                  "Condition": {
                    "StringEquals": {
                      "aws:RequestedRegion": "ap-northeast-2"
                    }
                  }
                },
                {
                  "Sid": "CreateBoundedRoles",
                  "Effect": "Allow",
                  "Action": [
                    "iam:CreateRole"
                  ],
                  "Resource": [
                    {
                      "Fn::Sub": "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/stock-paper/stock-paper-app-execution"
                    },
                    {
                      "Fn::Sub": "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/stock-paper/stock-paper-app-task"
                    },
                    {
                      "Fn::Sub": "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/stock-paper/stock-paper-app-scheduler"
                    }
                  ],
                  "Condition": {
                    "ArnEquals": {
                      "iam:PermissionsBoundary": [
                        {
                          "Fn::Sub": "arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/StockPaperAppExecutionBoundary"
                        },
                        {
                          "Fn::Sub": "arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/StockPaperAppTaskBoundary"
                        },
                        {
                          "Fn::Sub": "arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/StockPaperAppSchedulerBoundary"
                        }
                      ]
                    }
                  }
                },
                {
                  "Sid": "MaintainBoundedRoles",
                  "Effect": "Allow",
                  "Action": [
                    "iam:GetRole",
                    "iam:UpdateAssumeRolePolicy",
                    "iam:PutRolePolicy",
                    "iam:GetRolePolicy",
                    "iam:DeleteRolePolicy",
                    "iam:ListRolePolicies",
                    "iam:ListAttachedRolePolicies",
                    "iam:TagRole",
                    "iam:UntagRole",
                    "iam:DeleteRole"
                  ],
                  "Resource": [
                    {
                      "Fn::Sub": "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/stock-paper/stock-paper-app-execution"
                    },
                    {
                      "Fn::Sub": "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/stock-paper/stock-paper-app-task"
                    },
                    {
                      "Fn::Sub": "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/stock-paper/stock-paper-app-scheduler"
                    }
                  ]
                },
                {
                  "Sid": "OnlyExistingBoundaries",
                  "Effect": "Allow",
                  "Action": [
                    "iam:PutRolePermissionsBoundary"
                  ],
                  "Resource": [
                    {
                      "Fn::Sub": "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/stock-paper/stock-paper-app-execution"
                    },
                    {
                      "Fn::Sub": "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/stock-paper/stock-paper-app-task"
                    },
                    {
                      "Fn::Sub": "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/stock-paper/stock-paper-app-scheduler"
                    }
                  ],
                  "Condition": {
                    "ArnEquals": {
                      "iam:PermissionsBoundary": [
                        {
                          "Fn::Sub": "arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/StockPaperAppExecutionBoundary"
                        },
                        {
                          "Fn::Sub": "arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/StockPaperAppTaskBoundary"
                        },
                        {
                          "Fn::Sub": "arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/StockPaperAppSchedulerBoundary"
                        }
                      ]
                    }
                  }
                },
                {
                  "Sid": "OnlyExecutionManagedPolicy",
                  "Effect": "Allow",
                  "Action": [
                    "iam:AttachRolePolicy",
                    "iam:DetachRolePolicy"
                  ],
                  "Resource": {
                    "Fn::Sub": "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/stock-paper/stock-paper-app-execution"
                  },
                  "Condition": {
                    "ArnEquals": {
                      "iam:PolicyARN": "arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy"
                    }
                  }
                },
                {
                  "Sid": "ReadBoundaries",
                  "Effect": "Allow",
                  "Action": [
                    "iam:GetPolicy",
                    "iam:GetPolicyVersion"
                  ],
                  "Resource": [
                    {
                      "Fn::Sub": "arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/StockPaperAppExecutionBoundary"
                    },
                    {
                      "Fn::Sub": "arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/StockPaperAppTaskBoundary"
                    },
                    {
                      "Fn::Sub": "arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/StockPaperAppSchedulerBoundary"
                    }
                  ]
                },
                {
                  "Sid": "PassEcsRoles",
                  "Effect": "Allow",
                  "Action": [
                    "iam:PassRole"
                  ],
                  "Resource": [
                    {
                      "Fn::Sub": "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/stock-paper/stock-paper-app-execution"
                    },
                    {
                      "Fn::Sub": "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/stock-paper/stock-paper-app-task"
                    }
                  ],
                  "Condition": {
                    "StringEquals": {
                      "iam:PassedToService": "ecs-tasks.amazonaws.com"
                    }
                  }
                },
                {
                  "Sid": "PassSchedulerRole",
                  "Effect": "Allow",
                  "Action": [
                    "iam:PassRole"
                  ],
                  "Resource": {
                    "Fn::Sub": "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/stock-paper/stock-paper-app-scheduler"
                  },
                  "Condition": {
                    "StringEquals": {
                      "iam:PassedToService": "scheduler.amazonaws.com"
                    }
                  }
                },
                {
                  "Sid": "PaperSchedules",
                  "Effect": "Allow",
                  "Action": [
                    "scheduler:CreateSchedule",
                    "scheduler:UpdateSchedule",
                    "scheduler:DeleteSchedule",
                    "scheduler:GetSchedule"
                  ],
                  "Resource": {
                    "Fn::Sub": "arn:${AWS::Partition}:scheduler:${AWS::Region}:${AWS::AccountId}:schedule/default/stock-automation-paper-*"
                  }
                },
                {
                  "Sid": "InspectAbsentNamedRoles",
                  "Effect": "Allow",
                  "Action": [
                    "iam:GetRole",
                    "iam:GetRolePolicy",
                    "iam:ListRolePolicies",
                    "iam:ListAttachedRolePolicies"
                  ],
                  "Resource": [
                    {
                      "Fn::Sub": "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/stock-paper-app-execution"
                    },
                    {
                      "Fn::Sub": "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/stock-paper-app-task"
                    },
                    {
                      "Fn::Sub": "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/stock-paper-app-scheduler"
                    }
                  ]
                },
                {
                  "Sid": "CleanFailedAbsentRolePolicies",
                  "Effect": "Allow",
                  "Action": [
                    "iam:DeleteRolePolicy",
                    "iam:DeleteRole"
                  ],
                  "Resource": [
                    {
                      "Fn::Sub": "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/stock-paper-app-execution"
                    },
                    {
                      "Fn::Sub": "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/stock-paper-app-task"
                    },
                    {
                      "Fn::Sub": "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/stock-paper-app-scheduler"
                    }
                  ]
                },
                {
                  "Sid": "DetachFailedAbsentExecutionPolicy",
                  "Effect": "Allow",
                  "Action": [
                    "iam:DetachRolePolicy"
                  ],
                  "Resource": {
                    "Fn::Sub": "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/stock-paper-app-execution"
                  },
                  "Condition": {
                    "ArnEquals": {
                      "iam:PolicyARN": "arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy"
                    }
                  }
                }
              ]
            }
          }
        ]
      }
    },
    "OperatorAppPolicy": {
      "Type": "AWS::IAM::ManagedPolicy",
      "Properties": {
        "ManagedPolicyName": "StockPaperAppDeployment",
        "Users": [
          {
            "Ref": "OperatorUserName"
          }
        ],
        "PolicyDocument": {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Sid": "PreparePaperApp",
              "Effect": "Allow",
              "Action": [
                "cloudformation:CreateStack",
                "cloudformation:UpdateStack",
                "cloudformation:CreateChangeSet"
              ],
              "Resource": [
                {
                  "Fn::Sub": "arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/stock-automation-paper/*"
                },
                {
                  "Fn::Sub": "arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:changeSet/paper-app-*/*"
                }
              ],
              "Condition": {
                "ArnEquals": {
                  "cloudformation:RoleArn": {
                    "Fn::Sub": "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/stock-paper-app-deployer"
                  }
                }
              }
            },
            {
              "Sid": "InspectAndExecutePaperApp",
              "Effect": "Allow",
              "Action": [
                "cloudformation:DescribeStacks",
                "cloudformation:DescribeStackEvents",
                "cloudformation:DescribeStackResources",
                "cloudformation:GetTemplate",
                "cloudformation:DescribeChangeSet",
                "cloudformation:ExecuteChangeSet",
                "cloudformation:DeleteChangeSet"
              ],
              "Resource": [
                {
                  "Fn::Sub": "arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/stock-automation-paper/*"
                },
                {
                  "Fn::Sub": "arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:changeSet/paper-app-*/*"
                }
              ]
            },
            {
              "Sid": "InspectAppIamBootstrap",
              "Effect": "Allow",
              "Action": [
                "cloudformation:DescribeStacks",
                "cloudformation:DescribeStackEvents",
                "cloudformation:GetTemplate"
              ],
              "Resource": {
                "Fn::Sub": "arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/stock-automation-paper-app-iam/*"
              }
            },
            {
              "Sid": "Validate",
              "Effect": "Allow",
              "Action": [
                "cloudformation:ValidateTemplate"
              ],
              "Resource": "*"
            },
            {
              "Sid": "PassOnlyAppDeployment",
              "Effect": "Allow",
              "Action": [
                "iam:PassRole"
              ],
              "Resource": {
                "Fn::Sub": "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/stock-paper-app-deployer"
              },
              "Condition": {
                "StringEquals": {
                  "iam:PassedToService": "cloudformation.amazonaws.com"
                }
              }
            },
            {
              "Sid": "UploadPaperConfiguration",
              "Effect": "Allow",
              "Action": [
                "s3:PutObject",
                "s3:GetObject"
              ],
              "Resource": {
                "Fn::Sub": "arn:${AWS::Partition}:s3:::stock-automation-paper-${AWS::AccountId}-${AWS::Region}/config/*"
              }
            },
            {
              "Sid": "ReadPaperBucket",
              "Effect": "Allow",
              "Action": [
                "s3:ListBucket"
              ],
              "Resource": {
                "Fn::Sub": "arn:${AWS::Partition}:s3:::stock-automation-paper-${AWS::AccountId}-${AWS::Region}"
              }
            },
            {
              "Sid": "ReadPaperLedger",
              "Effect": "Allow",
              "Action": [
                "dynamodb:GetItem",
                "dynamodb:Scan",
                "dynamodb:DescribeTable"
              ],
              "Resource": {
                "Fn::Sub": "arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/stock-automation-paper"
              }
            },
            {
              "Sid": "ManualPaperTask",
              "Effect": "Allow",
              "Action": [
                "ecs:RunTask"
              ],
              "Resource": {
                "Fn::Sub": "arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:task-definition/stock-automation-paper:*"
              },
              "Condition": {
                "ArnEquals": {
                  "ecs:cluster": {
                    "Fn::Sub": "arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:cluster/stock-automation-paper"
                  }
                }
              }
            },
            {
              "Sid": "PassOnlyPaperRuntimeRoles",
              "Effect": "Allow",
              "Action": [
                "iam:PassRole"
              ],
              "Resource": [
                {
                  "Fn::Sub": "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/stock-paper/stock-paper-app-execution"
                },
                {
                  "Fn::Sub": "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/stock-paper/stock-paper-app-task"
                }
              ],
              "Condition": {
                "StringEquals": {
                  "iam:PassedToService": "ecs-tasks.amazonaws.com"
                }
              }
            },
            {
              "Sid": "InspectPaperCluster",
              "Effect": "Allow",
              "Action": [
                "ecs:ListTasks",
                "ecs:DescribeClusters"
              ],
              "Resource": {
                "Fn::Sub": "arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:cluster/stock-automation-paper"
              }
            },
            {
              "Sid": "InspectOrStopPaperTask",
              "Effect": "Allow",
              "Action": [
                "ecs:DescribeTasks",
                "ecs:StopTask"
              ],
              "Resource": {
                "Fn::Sub": "arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:task/stock-automation-paper/*"
              }
            },
            {
              "Sid": "InspectTaskDefinition",
              "Effect": "Allow",
              "Action": [
                "ecs:DescribeTaskDefinition"
              ],
              "Resource": "*",
              "Condition": {
                "StringEquals": {
                  "aws:RequestedRegion": "ap-northeast-2"
                }
              }
            },
            {
              "Sid": "ReadOnlyPaperArtifacts",
              "Effect": "Allow",
              "Action": [
                "s3:GetObject"
              ],
              "Resource": {
                "Fn::Sub": "arn:${AWS::Partition}:s3:::stock-automation-paper-${AWS::AccountId}-${AWS::Region}/*"
              }
            },
            {
              "Sid": "ReadOnlyPaperLogs",
              "Effect": "Allow",
              "Action": [
                "logs:DescribeLogStreams",
                "logs:GetLogEvents",
                "logs:FilterLogEvents"
              ],
              "Resource": {
                "Fn::Sub": "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/stock-automation/paper:*"
              }
            },
            {
              "Sid": "CleanupOnlyOwnPaperStack",
              "Effect": "Allow",
              "Action": [
                "cloudformation:DeleteStack"
              ],
              "Resource": {
                "Fn::Sub": "arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/stock-automation-paper/*"
              },
              "Condition": {
                "ArnEquals": {
                  "cloudformation:RoleArn": {
                    "Fn::Sub": "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/stock-paper-app-deployer"
                  }
                }
              }
            },
            {
              "Sid": "InspectPaperArtifactOwnership",
              "Effect": "Allow",
              "Action": [
                "s3:GetBucketTagging"
              ],
              "Resource": {
                "Fn::Sub": "arn:${AWS::Partition}:s3:::stock-automation-paper-${AWS::AccountId}-${AWS::Region}"
              }
            },
            {
              "Sid": "InspectPaperTableOwnership",
              "Effect": "Allow",
              "Action": [
                "dynamodb:ListTagsOfResource"
              ],
              "Resource": {
                "Fn::Sub": "arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/stock-automation-paper"
              }
            }
          ]
        }
      }
    }
  },
  "Outputs": {
    "AppDeploymentRoleArn": {
      "Value": {
        "Fn::GetAtt": [
          "AppDeploymentRole",
          "Arn"
        ]
      }
    }
  }
}
