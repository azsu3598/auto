{
  "AWSTemplateFormatVersion": "2010-09-09",
  "Description": "One dated paper closing-bet session after independent morning PASS; no regular schedule changes",
  "Parameters": {
    "NatInstanceId": {
      "Type": "String"
    },
    "ArtifactBucketName": {
      "Type": "String"
    },
    "TelegramSecretArn": {
      "Type": "String"
    },
    "ImageUri": {
      "Type": "String"
    },
    "ClusterArn": {
      "Type": "String"
    },
    "TaskExecutionRoleArn": {
      "Type": "String"
    },
    "TaskRoleArn": {
      "Type": "String"
    },
    "AppLogGroupName": {
      "Type": "String"
    },
    "ControlFunctionArn": {
      "Type": "String"
    },
    "KiwoomDemoSecretArn": {
      "Type": "String"
    },
    "DartSecretArn": {
      "Type": "String"
    },
    "ExpectedEgressIp": {
      "Type": "String"
    },
    "TradeNotificationTopicArn": {
      "Type": "String"
    },
    "SubnetIds": {
      "Type": "CommaDelimitedList"
    },
    "SecurityGroupIds": {
      "Type": "CommaDelimitedList"
    },
    "OperatorUserName": {
      "Type": "String",
      "Default": "stock-paper-operator",
      "AllowedValues": [
        "stock-paper-operator"
      ]
    },
    "StartingCash": {
      "Type": "String",
      "Default": "200000"
    },
    "MediumStartingCash": {
      "Type": "String",
      "Default": "200000"
    },
    "DayTradeStartingCash": {
      "Type": "String",
      "Default": "200000"
    },
    "BuyFeeBps": {
      "Type": "String",
      "Default": "1.5"
    },
    "SellFeeBps": {
      "Type": "String",
      "Default": "1.5"
    },
    "SellTaxBps": {
      "Type": "String",
      "Default": "20"
    },
    "PaperWalletEpoch": {
      "Type": "String",
      "Default": "",
      "AllowedPattern": "[A-Za-z0-9_-]{0,40}"
    },
    "PilotId": {
      "Type": "String",
      "AllowedPattern": "[a-f0-9]{32}"
    },
    "PlanKey": {
      "Type": "String"
    },
    "PlanSha256": {
      "Type": "String",
      "AllowedPattern": "[a-f0-9]{64}"
    },
    "MorningResultKey": {
      "Type": "String"
    },
    "EntryDate": {
      "Type": "String"
    },
    "ExitDate": {
      "Type": "String"
    },
    "DecisionKey": {
      "Type": "String"
    },
    "PilotState": {
      "Type": "String",
      "Default": "DISABLED",
      "AllowedValues": [
        "DISABLED",
        "ENABLED"
      ]
    },
    "RegularScheduleArns": {
      "Type": "CommaDelimitedList"
    },
    "GateScheduleAt": {
      "Type": "String",
      "AllowedPattern": "[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}"
    },
    "StartPmScheduleAt": {
      "Type": "String",
      "AllowedPattern": "[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}"
    },
    "Scan1450ScheduleAt": {
      "Type": "String",
      "AllowedPattern": "[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}"
    },
    "Shortlist1510ScheduleAt": {
      "Type": "String",
      "AllowedPattern": "[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}"
    },
    "Entry1520ScheduleAt": {
      "Type": "String",
      "AllowedPattern": "[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}"
    },
    "EquitySnapshot1550ScheduleAt": {
      "Type": "String",
      "AllowedPattern": "[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}"
    },
    "StopPmScheduleAt": {
      "Type": "String",
      "AllowedPattern": "[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}"
    },
    "ReportPmScheduleAt": {
      "Type": "String",
      "AllowedPattern": "[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}"
    },
    "StartAmScheduleAt": {
      "Type": "String",
      "AllowedPattern": "[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}"
    },
    "Exit0905ScheduleAt": {
      "Type": "String",
      "AllowedPattern": "[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}"
    },
    "Exit0910ScheduleAt": {
      "Type": "String",
      "AllowedPattern": "[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}"
    },
    "StopAmScheduleAt": {
      "Type": "String",
      "AllowedPattern": "[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}"
    },
    "ReportAmScheduleAt": {
      "Type": "String",
      "AllowedPattern": "[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}"
    },
    "FallbackPmScheduleAt": {
      "Type": "String",
      "AllowedPattern": "[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}"
    },
    "FallbackAmScheduleAt": {
      "Type": "String",
      "AllowedPattern": "[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}"
    }
  },
  "Resources": {
    "PilotTask": {
      "Type": "AWS::ECS::TaskDefinition",
      "Properties": {
        "Family": "stock-automation-paper-pilot",
        "Cpu": "512",
        "Memory": "1024",
        "NetworkMode": "awsvpc",
        "RequiresCompatibilities": [
          "FARGATE"
        ],
        "ExecutionRoleArn": {
          "Ref": "TaskExecutionRoleArn"
        },
        "TaskRoleArn": {
          "Ref": "TaskRoleArn"
        },
        "Tags": [
          {
            "Key": "Project",
            "Value": "stock-automation-paper"
          }
        ],
        "Volumes": [
          {
            "Name": "runtime-tmp"
          }
        ],
        "ContainerDefinitions": [
          {
            "Name": "stock-automation",
            "Image": {
              "Ref": "ImageUri"
            },
            "Essential": true,
            "User": "65534:65534",
            "ReadonlyRootFilesystem": true,
            "LinuxParameters": {
              "Capabilities": {
                "Drop": [
                  "ALL"
                ]
              },
              "InitProcessEnabled": true
            },
            "MountPoints": [
              {
                "SourceVolume": "runtime-tmp",
                "ContainerPath": "/tmp",
                "ReadOnly": false
              }
            ],
            "EntryPoint": [
              "python"
            ],
            "Command": [
              "-c",
              "\"\"\"Prewarm a dated paper phase without changing the production clock guards.\"\"\"\nfrom datetime import datetime, timedelta, timezone\nimport json\nimport os\nimport time\n\nPHASE_TIMES = {'SCAN_1450': (14, 50), 'SHORTLIST_1510': (15, 10),\n    'ENTRY_1520': (15, 20), 'EQUITY_SNAPSHOT_1550': (15, 50),\n    'EXIT_0905': (9, 5), 'EXIT_0910': (9, 10)}\nKST = timezone(timedelta(hours=9))\n\n\ndef wait_for_occurrence(env, *, clock, sleep, monotonic):\n    phase = env.get('RUN_PHASE')\n    if env.get('KIWOOM_MODE') != 'demo' or env.get('LIVE_ORDER_ENABLED') != '0' or phase not in PHASE_TIMES:\n        raise ValueError('DATED_PAPER_PHASE_ONLY')\n    occurrence = datetime.fromisoformat(env['SCHEDULED_AT'])\n    dispatch = datetime.fromisoformat(env['DISPATCHED_AT'])\n    if occurrence.tzinfo is None or dispatch.tzinfo is None:\n        raise ValueError('TIMEZONE_REQUIRED')\n    local = occurrence.astimezone(KST)\n    day = env['PILOT_EXIT_DATE'] if phase.startswith('EXIT_') else env['PILOT_ENTRY_DATE']\n    if (local.date().isoformat() != day or local.weekday() >= 5\n            or (local.hour, local.minute) != PHASE_TIMES[phase] or local.second or local.microsecond\n            or not 120 <= (occurrence - dispatch).total_seconds() <= 180):\n        raise ValueError('WRONG_PILOT_OCCURRENCE')\n    now = clock()\n    if now < dispatch or not -120 <= (occurrence - now).total_seconds() <= 300:\n        raise ValueError('OUTSIDE_PREWARM_WINDOW')\n    deadline = monotonic() + 300\n    while clock() < occurrence:\n        if monotonic() >= deadline:\n            raise ValueError('PREWARM_BOUND_EXCEEDED')\n        sleep(1)\n    # run_bounded independently enforces the original, phase-specific late limit.\n\n\ndef main():\n    try:\n        wait_for_occurrence(os.environ, clock=lambda: datetime.now(timezone.utc), sleep=time.sleep, monotonic=time.monotonic)\n    except Exception:\n        print(json.dumps({'status': 'RUN_REJECTED', 'reason': 'INVALID_PILOT_OCCURRENCE', 'paper_only': True}), flush=True)\n        return 2\n    from stock_automation.scheduled_execution import run_bounded\n    return run_bounded()\n\n\nif __name__ == '__main__':\n    raise SystemExit(main())\n"
            ],
            "Environment": [
              {
                "Name": "KIWOOM_MODE",
                "Value": "demo"
              },
              {
                "Name": "KIWOOM_TOKEN_STORE",
                "Value": "memory"
              },
              {
                "Name": "LIVE_ORDER_ENABLED",
                "Value": "0"
              },
              {
                "Name": "NAT_INSTANCE_ID",
                "Value": {
                  "Ref": "NatInstanceId"
                }
              },
              {
                "Name": "EXPECTED_EGRESS_IP",
                "Value": {
                  "Ref": "ExpectedEgressIp"
                }
              },
              {
                "Name": "PAPER_BUCKET",
                "Value": {
                  "Ref": "ArtifactBucketName"
                }
              },
              {
                "Name": "PAPER_TABLE",
                "Value": "stock-automation-paper"
              },
              {
                "Name": "TRADING_CALENDAR_KEY",
                "Value": "config/calendar/current.json"
              },
              {
                "Name": "STARTING_CASH",
                "Value": {
                  "Ref": "StartingCash"
                }
              },
              {
                "Name": "MEDIUM_STARTING_CASH",
                "Value": {
                  "Ref": "MediumStartingCash"
                }
              },
              {
                "Name": "DAY_TRADE_STARTING_CASH",
                "Value": {
                  "Ref": "DayTradeStartingCash"
                }
              },
              {
                "Name": "BUY_FEE_BPS",
                "Value": {
                  "Ref": "BuyFeeBps"
                }
              },
              {
                "Name": "SELL_FEE_BPS",
                "Value": {
                  "Ref": "SellFeeBps"
                }
              },
              {
                "Name": "SELL_TAX_BPS",
                "Value": {
                  "Ref": "SellTaxBps"
                }
              },
              {
                "Name": "PAPER_WALLET_EPOCH",
                "Value": {
                  "Ref": "PaperWalletEpoch"
                }
              },
              {
                "Name": "NOTIFICATION_CHANNEL",
                "Value": "telegram"
              },
              {
                "Name": "NOTIFICATION_SECRET_ARN",
                "Value": {
                  "Ref": "TelegramSecretArn"
                }
              },
              {
                "Name": "SNS_NOTIFICATION_TOPIC_ARN",
                "Value": {
                  "Ref": "TradeNotificationTopicArn"
                }
              },
              {
                "Name": "PILOT_ENTRY_DATE",
                "Value": {
                  "Ref": "EntryDate"
                }
              },
              {
                "Name": "PILOT_EXIT_DATE",
                "Value": {
                  "Ref": "ExitDate"
                }
              }
            ],
            "Secrets": [
              {
                "Name": "APP_KEY_MOCK",
                "ValueFrom": {
                  "Fn::Sub": "${KiwoomDemoSecretArn}:app_key_mock::"
                }
              },
              {
                "Name": "APP_SECRET_MOCK",
                "ValueFrom": {
                  "Fn::Sub": "${KiwoomDemoSecretArn}:app_secret_mock::"
                }
              },
              {
                "Name": "DART_API_KEY",
                "ValueFrom": {
                  "Fn::Sub": "${DartSecretArn}:dart_api_key::"
                }
              }
            ],
            "LogConfiguration": {
              "LogDriver": "awslogs",
              "Options": {
                "awslogs-group": {
                  "Ref": "AppLogGroupName"
                },
                "awslogs-region": {
                  "Ref": "AWS::Region"
                },
                "awslogs-stream-prefix": "paper"
              }
            }
          }
        ]
      }
    },
    "Boundary": {
      "Type": "AWS::IAM::ManagedPolicy",
      "Properties": {
        "ManagedPolicyName": "StockPaperPilotBoundary",
        "PolicyDocument": {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Action": [
                "ecs:RunTask"
              ],
              "Resource": {
                "Ref": "PilotTask"
              },
              "Condition": {
                "ArnEquals": {
                  "ecs:cluster": {
                    "Ref": "ClusterArn"
                  }
                }
              }
            },
            {
              "Effect": "Allow",
              "Action": [
                "iam:PassRole"
              ],
              "Resource": [
                {
                  "Ref": "TaskExecutionRoleArn"
                },
                {
                  "Ref": "TaskRoleArn"
                }
              ],
              "Condition": {
                "StringEquals": {
                  "iam:PassedToService": "ecs-tasks.amazonaws.com"
                }
              }
            },
            {
              "Effect": "Allow",
              "Action": [
                "ecs:DescribeClusters"
              ],
              "Resource": {
                "Ref": "ClusterArn"
              }
            },
            {
              "Effect": "Allow",
              "Action": [
                "ecs:DescribeTasks",
                "ecs:StopTask"
              ],
              "Resource": {
                "Fn::Sub": "arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:task/stock-automation-paper/*"
              }
            },
            {
              "Effect": "Allow",
              "Action": [
                "ecs:DescribeTaskDefinition",
                "ec2:DescribeInstances"
              ],
              "Resource": "*",
              "Condition": {
                "StringEquals": {
                  "aws:RequestedRegion": "ap-northeast-2"
                }
              }
            },
            {
              "Effect": "Allow",
              "Action": [
                "cloudformation:DescribeStacks"
              ],
              "Resource": [
                {
                  "Fn::Sub": "arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/stock-automation-paper/*"
                },
                {
                  "Fn::Sub": "arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/stock-automation-paper-control/*"
                },
                {
                  "Fn::Sub": "arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/stock-automation-paper-network/*"
                }
              ]
            },
            {
              "Effect": "Allow",
              "Action": [
                "scheduler:GetSchedule"
              ],
              "Resource": {
                "Ref": "RegularScheduleArns"
              }
            },
            {
              "Effect": "Allow",
              "Action": [
                "lambda:InvokeFunction"
              ],
              "Resource": {
                "Ref": "ControlFunctionArn"
              }
            },
            {
              "Effect": "Allow",
              "Action": [
                "dynamodb:GetItem",
                "dynamodb:Scan"
              ],
              "Resource": {
                "Fn::Sub": "arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/stock-automation-paper"
              }
            },
            {
              "Effect": "Allow",
              "Action": [
                "s3:GetObject",
                "s3:PutObject"
              ],
              "Resource": {
                "Fn::Sub": "arn:${AWS::Partition}:s3:::${ArtifactBucketName}/validation/pilot/${PilotId}/*"
              }
            },
            {
              "Effect": "Allow",
              "Action": [
                "s3:ListBucket"
              ],
              "Resource": {
                "Fn::Sub": "arn:${AWS::Partition}:s3:::${ArtifactBucketName}"
              },
              "Condition": {
                "StringLike": {
                  "s3:prefix": [
                    {
                      "Fn::Sub": "validation/pilot/${PilotId}/*"
                    },
                    {
                      "Ref": "DecisionKey"
                    }
                  ]
                }
              }
            },
            {
              "Effect": "Allow",
              "Action": [
                "s3:GetObject"
              ],
              "Resource": [
                {
                  "Fn::Sub": "arn:${AWS::Partition}:s3:::${ArtifactBucketName}/${PlanKey}"
                },
                {
                  "Fn::Sub": "arn:${AWS::Partition}:s3:::${ArtifactBucketName}/${DecisionKey}"
                },
                {
                  "Fn::Sub": "arn:${AWS::Partition}:s3:::${ArtifactBucketName}/config/calendar/current.json"
                },
                {
                  "Fn::Sub": "arn:${AWS::Partition}:s3:::${ArtifactBucketName}/${MorningResultKey}"
                }
              ]
            },
            {
              "Effect": "Allow",
              "Action": [
                "secretsmanager:GetSecretValue"
              ],
              "Resource": {
                "Ref": "TelegramSecretArn"
              }
            },
            {
              "Effect": "Allow",
              "Action": [
                "logs:CreateLogStream",
                "logs:PutLogEvents"
              ],
              "Resource": {
                "Fn::Sub": "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/stock-paper-pilot:*"
              }
            }
          ]
        }
      }
    },
    "PilotRole": {
      "Type": "AWS::IAM::Role",
      "Properties": {
        "RoleName": "stock-paper-pilot",
        "Path": "/stock-paper/",
        "PermissionsBoundary": {
          "Ref": "Boundary"
        },
        "AssumeRolePolicyDocument": {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Principal": {
                "Service": "lambda.amazonaws.com"
              },
              "Action": "sts:AssumeRole"
            }
          ]
        },
        "Policies": [
          {
            "PolicyName": "one-dated-paper-session",
            "PolicyDocument": {
              "Version": "2012-10-17",
              "Statement": [
                {
                  "Effect": "Allow",
                  "Action": [
                    "ecs:RunTask"
                  ],
                  "Resource": {
                    "Ref": "PilotTask"
                  },
                  "Condition": {
                    "ArnEquals": {
                      "ecs:cluster": {
                        "Ref": "ClusterArn"
                      }
                    }
                  }
                },
                {
                  "Effect": "Allow",
                  "Action": [
                    "iam:PassRole"
                  ],
                  "Resource": [
                    {
                      "Ref": "TaskExecutionRoleArn"
                    },
                    {
                      "Ref": "TaskRoleArn"
                    }
                  ],
                  "Condition": {
                    "StringEquals": {
                      "iam:PassedToService": "ecs-tasks.amazonaws.com"
                    }
                  }
                },
                {
                  "Effect": "Allow",
                  "Action": [
                    "ecs:DescribeClusters"
                  ],
                  "Resource": {
                    "Ref": "ClusterArn"
                  }
                },
                {
                  "Effect": "Allow",
                  "Action": [
                    "ecs:DescribeTasks",
                    "ecs:StopTask"
                  ],
                  "Resource": {
                    "Fn::Sub": "arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:task/stock-automation-paper/*"
                  }
                },
                {
                  "Effect": "Allow",
                  "Action": [
                    "ecs:DescribeTaskDefinition",
                    "ec2:DescribeInstances"
                  ],
                  "Resource": "*",
                  "Condition": {
                    "StringEquals": {
                      "aws:RequestedRegion": "ap-northeast-2"
                    }
                  }
                },
                {
                  "Effect": "Allow",
                  "Action": [
                    "cloudformation:DescribeStacks"
                  ],
                  "Resource": [
                    {
                      "Fn::Sub": "arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/stock-automation-paper/*"
                    },
                    {
                      "Fn::Sub": "arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/stock-automation-paper-control/*"
                    },
                    {
                      "Fn::Sub": "arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/stock-automation-paper-network/*"
                    }
                  ]
                },
                {
                  "Effect": "Allow",
                  "Action": [
                    "scheduler:GetSchedule"
                  ],
                  "Resource": {
                    "Ref": "RegularScheduleArns"
                  }
                },
                {
                  "Effect": "Allow",
                  "Action": [
                    "lambda:InvokeFunction"
                  ],
                  "Resource": {
                    "Ref": "ControlFunctionArn"
                  }
                },
                {
                  "Effect": "Allow",
                  "Action": [
                    "dynamodb:GetItem",
                    "dynamodb:Scan"
                  ],
                  "Resource": {
                    "Fn::Sub": "arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/stock-automation-paper"
                  }
                },
                {
                  "Effect": "Allow",
                  "Action": [
                    "s3:GetObject",
                    "s3:PutObject"
                  ],
                  "Resource": {
                    "Fn::Sub": "arn:${AWS::Partition}:s3:::${ArtifactBucketName}/validation/pilot/${PilotId}/*"
                  }
                },
                {
                  "Effect": "Allow",
                  "Action": [
                    "s3:ListBucket"
                  ],
                  "Resource": {
                    "Fn::Sub": "arn:${AWS::Partition}:s3:::${ArtifactBucketName}"
                  },
                  "Condition": {
                    "StringLike": {
                      "s3:prefix": [
                        {
                          "Fn::Sub": "validation/pilot/${PilotId}/*"
                        },
                        {
                          "Ref": "DecisionKey"
                        }
                      ]
                    }
                  }
                },
                {
                  "Effect": "Allow",
                  "Action": [
                    "s3:GetObject"
                  ],
                  "Resource": [
                    {
                      "Fn::Sub": "arn:${AWS::Partition}:s3:::${ArtifactBucketName}/${PlanKey}"
                    },
                    {
                      "Fn::Sub": "arn:${AWS::Partition}:s3:::${ArtifactBucketName}/${DecisionKey}"
                    },
                    {
                      "Fn::Sub": "arn:${AWS::Partition}:s3:::${ArtifactBucketName}/config/calendar/current.json"
                    },
                    {
                      "Fn::Sub": "arn:${AWS::Partition}:s3:::${ArtifactBucketName}/${MorningResultKey}"
                    }
                  ]
                },
                {
                  "Effect": "Allow",
                  "Action": [
                    "secretsmanager:GetSecretValue"
                  ],
                  "Resource": {
                    "Ref": "TelegramSecretArn"
                  }
                },
                {
                  "Effect": "Allow",
                  "Action": [
                    "logs:CreateLogStream",
                    "logs:PutLogEvents"
                  ],
                  "Resource": {
                    "Fn::Sub": "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/stock-paper-pilot:*"
                  }
                }
              ]
            }
          }
        ]
      }
    },
    "LogGroup": {
      "Type": "AWS::Logs::LogGroup",
      "Properties": {
        "LogGroupName": "/aws/lambda/stock-paper-pilot",
        "RetentionInDays": 7
      }
    },
    "Pilot": {
      "Type": "AWS::Lambda::Function",
      "DependsOn": "LogGroup",
      "Properties": {
        "FunctionName": "stock-paper-pilot",
        "Runtime": "python3.13",
        "Handler": "index.handler",
        "MemorySize": 128,
        "Timeout": 900,
        "ReservedConcurrentExecutions": 2,
        "Role": {
          "Fn::GetAtt": [
