                    "Arn"
                  ]
                },
                {
                  "Fn::GetAtt": [
                    "EquitySnapshot1550Schedule",
                    "Arn"
                  ]
                },
                {
                  "Fn::GetAtt": [
                    "StopPmSchedule",
                    "Arn"
                  ]
                },
                {
                  "Fn::GetAtt": [
                    "ReportPmSchedule",
                    "Arn"
                  ]
                },
                {
                  "Fn::GetAtt": [
                    "StartAmSchedule",
                    "Arn"
                  ]
                },
                {
                  "Fn::GetAtt": [
                    "Exit0905Schedule",
                    "Arn"
                  ]
                },
                {
                  "Fn::GetAtt": [
                    "Exit0910Schedule",
                    "Arn"
                  ]
                },
                {
                  "Fn::GetAtt": [
                    "StopAmSchedule",
                    "Arn"
                  ]
                },
                {
                  "Fn::GetAtt": [
                    "ReportAmSchedule",
                    "Arn"
                  ]
                },
                {
                  "Fn::GetAtt": [
                    "FallbackPmSchedule",
                    "Arn"
                  ]
                },
                {
                  "Fn::GetAtt": [
                    "FallbackAmSchedule",
                    "Arn"
                  ]
                }
              ]
            },
            {
              "Effect": "Allow",
              "Action": [
                "iam:PassRole"
              ],
              "Resource": {
                "Fn::GetAtt": [
                  "SchedulerRole",
                  "Arn"
                ]
              },
              "Condition": {
                "StringEquals": {
                  "iam:PassedToService": "scheduler.amazonaws.com"
                }
              }
            },
            {
              "Effect": "Allow",
              "Action": [
                "logs:DescribeLogStreams",
                "logs:GetLogEvents",
                "logs:FilterLogEvents"
              ],
              "Resource": {
                "Fn::Sub": "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/stock-paper-pilot:*"
              }
            }
          ]
        }
      }
    }
