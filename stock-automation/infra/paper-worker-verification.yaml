      "Properties": {
        "FunctionName": "stock-paper-worker-verifier",
        "Runtime": "python3.13",
        "Handler": "index.handler",
        "MemorySize": 128,
        "Timeout": 900,
        "ReservedConcurrentExecutions": 1,
