            "Fn::Sub": "{\"action\":\"RUN\",\"test_id\":\"${TestId}\"}"
          },
          "RetryPolicy": {
            "MaximumEventAgeInSeconds": 60,
            "MaximumRetryAttempts": 0
          }
        }
      }
    },
    "WatchTest": {
      "Type": "AWS::Scheduler::Schedule",
      "Properties": {
        "Name": "stock-paper-worker-test-watch",
        "State": {
          "Ref": "VerificationState"
        },
        "ScheduleExpression": {
          "Fn::Sub": "at(${WatchAt})"
        },
        "ScheduleExpressionTimezone": "UTC",
        "FlexibleTimeWindow": {
          "Mode": "OFF"
        },
        "Target": {
          "Arn": {
            "Fn::GetAtt": [
              "Verifier",
              "Arn"
            ]
          },
          "RoleArn": {
            "Fn::GetAtt": [
              "SchedulerRole",
              "Arn"
            ]
          },
          "Input": {
            "Fn::Sub": "{\"action\":\"WATCH\",\"test_id\":\"${TestId}\"}"
          },
          "RetryPolicy": {
            "MaximumEventAgeInSeconds": 60,
            "MaximumRetryAttempts": 0
          }
        }
      }
    },
    "FallbackStop": {
