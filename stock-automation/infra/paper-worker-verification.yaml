        "State": {
          "Ref": "VerificationState"
        },
        "ScheduleExpression": {
          "Fn::Sub": "at(${FailSafeAt})"
        },
        "ScheduleExpressionTimezone": "UTC",
        "FlexibleTimeWindow": {
          "Mode": "OFF"
        },
        "Target": {
