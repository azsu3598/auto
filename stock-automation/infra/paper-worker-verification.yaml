    "OperatorReviewPolicy": {
      "Type": "AWS::IAM::ManagedPolicy",
      "Properties": {
        "ManagedPolicyName": "StockPaperWorkerVerifierReview",
        "Users": [
          {
            "Ref": "OperatorUserName"
          }
        ],
        "PolicyDocument": {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Action": [
                "ecs:ListTasks"
              ],
              "Resource": "*",
              "Condition": {
                "ArnEquals": {
                  "ecs:cluster": {
                    "Ref": "ClusterArn"
                  }
                },
                "StringEquals": {
                  "aws:RequestedRegion": "ap-northeast-2"
                }
              }
            },
            {
              "Effect": "Allow",
              "Action": [
                "cloudformation:DescribeStacks",
                "cloudformation:DescribeStackEvents",
                "cloudformation:DescribeStackResources",
                "cloudformation:GetTemplate"
              ],
              "Resource": {
                "Fn::Sub": "arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/stock-automation-paper-worker-test/*"
              }
            },
            {
              "Effect": "Allow",
              "Action": [
                "lambda:GetFunction",
                "lambda:GetFunctionConfiguration"
              ],
              "Resource": {
                "Fn::GetAtt": [
                  "Verifier",
                  "Arn"
                ]
              }
            },
            {
              "Effect": "Allow",
              "Action": [
                "s3:GetObject",
                "s3:PutObject"
              ],
              "Resource": {
                "Fn::Sub": "arn:${AWS::Partition}:s3:::${ArtifactBucketName}/validation/worker/${TestId}.json"
              }
            },
            {
              "Effect": "Allow",
              "Action": [
                "scheduler:GetSchedule",
                "scheduler:UpdateSchedule"
              ],
              "Resource": [
                {
                  "Fn::GetAtt": [
                    "StartTest",
                    "Arn"
                  ]
                },
                {
                  "Fn::GetAtt": [
                    "RunTest",
                    "Arn"
                  ]
                },
                {
                  "Fn::GetAtt": [
                    "WatchTest",
                    "Arn"
                  ]
                },
                {
                  "Fn::GetAtt": [
                    "FallbackStop",
                    "Arn"
                  ]
                }
              ]
            },
            {
              "Effect": "Allow",
              "Action": [
                "iam:PassRole"
              ],
              "Resource": {
                "Fn::GetAtt": [
                  "SchedulerRole",
                  "Arn"
                ]
              },
              "Condition": {
                "StringEquals": {
                  "iam:PassedToService": "scheduler.amazonaws.com"
                }
              }
            },
            {
              "Effect": "Allow",
              "Action": [
                "logs:DescribeLogStreams",
                "logs:GetLogEvents",
                "logs:FilterLogEvents"
              ],
              "Resource": {
                "Fn::Sub": "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/stock-paper-worker-verifier:*"
              }
            }
          ]
        }
      }
    }
