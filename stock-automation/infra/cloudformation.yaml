AWSTemplateFormatVersion: "2010-09-09"
Description: Scheduled Korean closing-bet paper trader (no live order permissions)

Parameters:
  NatInstanceId:
    Type: String
    AllowedPattern: '^i-[a-f0-9]{8,17}$'
    Description: Existing stopped or running paper NAT; no new instance is created
  ImageUri:
    Type: String
    Description: ECR image URI built from stock-automation/Dockerfile
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
  SecurityGroupIds:
    Type: List<AWS::EC2::SecurityGroup::Id>
  AssignPublicIp:
    Type: String
    Default: DISABLED
    AllowedValues: [DISABLED]
    Description: Use the verified private subnet and fixed NAT egress; public task IPs are disabled
  ExpectedEgressIp:
    Type: String
    AllowedPattern: "^[0-9]{1,3}([.][0-9]{1,3}){3}$"
    Description: Verified fixed egress IP from the existing NAT network stack; do not commit parameter values
  KiwoomDemoSecretArn:
    Type: String
    AllowedPattern: "^arn:aws:secretsmanager:ap-northeast-2:[0-9]{12}:secret:stock-automation-paper/kiwoom-demo-[A-Za-z0-9]{6}$"
    Description: Secrets Manager JSON with app_key_mock and app_secret_mock
  DartSecretArn:
    Type: String
    AllowedPattern: "^arn:aws:secretsmanager:ap-northeast-2:[0-9]{12}:secret:stock-automation-paper/dart-[A-Za-z0-9]{6}$"
    Description: Secrets Manager JSON with dart_api_key (free OpenDART key)
  StartingCash:
    Type: Number
    Default: 200000
  MediumStartingCash:
    Type: Number
    Default: 200000
    Description: Separate paper capital for the 20-40 trading-day strategy
  DayTradeStartingCash:
    Type: Number
    Default: 200000
    Description: Separate paper capital for explicitly invoked day-trade scans
  PaperWalletEpoch:
    Type: String
    Default: ""
    AllowedPattern: "[A-Za-z0-9_-]{0,40}"
    Description: Appended to every paper wallet key to start a new ledger (e.g. 200K-20261103); empty keeps the original wallets
  BuyFeeBps:
    Type: Number
    Description: Verified broker buy commission in basis points, used by the paper ledger and replay/tuning
    MinValue: 0
    MaxValue: 100
  SellFeeBps:
    Type: Number
    Description: Verified broker sell commission in basis points, used by the paper ledger and replay/tuning
    MinValue: 0
    MaxValue: 100
  SellTaxBps:
    Type: Number
    Description: Verified applicable sell tax in basis points, used by the paper ledger and replay/tuning
    MinValue: 0
    MaxValue: 100
  CoreScheduleState:
    Type: String
    Default: DISABLED
    AllowedValues: [DISABLED]
    Description: Integration preparation only; enablement requires a reviewed template update after all operational checks
  NxtScheduleState:
    Type: String
    Default: DISABLED
    AllowedValues: [DISABLED]
  NotificationChannel:
    Type: String
    Default: telegram
    AllowedValues: [telegram, kakao, email, disabled]
    Description: Free mobile messenger used for paper trade alerts
  NotificationSecretArn:
    Type: String
    Default: ""
    AllowedPattern: "^$|^arn:aws[a-z-]*:secretsmanager:ap-northeast-2:[0-9]{12}:secret:.+$"
    Description: Secrets Manager JSON; Telegram requires bot_token and chat_id
  NotificationEmail:
    Type: String
    Default: ""
    Description: Optional SNS email fallback; confirmation is required

Conditions:
  HasNotificationSecret: !Not [!Equals [!Ref NotificationSecretArn, ""]]
  HasNotificationEmail: !Not [!Equals [!Ref NotificationEmail, ""]]
  IsKakaoNotification: !And [!Equals [!Ref NotificationChannel, kakao], !Condition HasNotificationSecret]

Resources:
  ArtifactBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "stock-automation-paper-${AWS::AccountId}-${AWS::Region}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: expire-raw-snapshots
            Status: Enabled
            Prefix: runs/
            ExpirationInDays: 365

  TradeNotificationTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: stock-automation-paper
      DisplayName: stock-automation-paper

  TradeNotificationEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasNotificationEmail
    Properties:
      Protocol: email
      Endpoint: !Ref NotificationEmail
      TopicArn: !Ref TradeNotificationTopic

  PaperTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: stock-automation-paper
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true

  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: stock-automation-paper

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /stock-automation/paper
      RetentionInDays: 30

  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: stock-paper-app-execution
      Path: /stock-paper/
      PermissionsBoundary: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/StockPaperAppExecutionBoundary"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: ecs-tasks.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: read-kiwoom-demo-secret
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: [!Ref KiwoomDemoSecretArn, !Ref DartSecretArn]

  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: stock-paper-app-task
      Path: /stock-paper/
      PermissionsBoundary: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/StockPaperAppTaskBoundary"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: ecs-tasks.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: paper-artifacts-only
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ec2:DescribeInstances
                Resource: "*"
                Condition:
                  StringEquals: {aws:RequestedRegion: ap-northeast-2}
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject]
                Resource: !Sub "${ArtifactBucket.Arn}/*"
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt ArtifactBucket.Arn
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:DeleteItem, dynamodb:ConditionCheckItem, dynamodb:Scan]
                Resource: !GetAtt PaperTable.Arn
              - !If
                - HasNotificationSecret
                - Effect: Allow
                  Action: secretsmanager:GetSecretValue
                  Resource: !Ref NotificationSecretArn
                - !Ref AWS::NoValue
              - !If
                - IsKakaoNotification
                - Effect: Allow
                  Action: secretsmanager:PutSecretValue
                  Resource: !Ref NotificationSecretArn
                - !Ref AWS::NoValue
              - Effect: Allow
                Action: sns:Publish
                Resource: !Ref TradeNotificationTopic

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Tags: [{Key: Project, Value: stock-automation-paper}]
      Family: stock-automation-paper
      Cpu: "512"
      Memory: "1024"
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      Volumes:
        - Name: runtime-tmp
      ContainerDefinitions:
        - Name: stock-automation
          Image: !Ref ImageUri
          Essential: true
          User: "65534:65534"
          ReadonlyRootFilesystem: true
          LinuxParameters:
            Capabilities:
              Drop: [ALL]
            InitProcessEnabled: true
          MountPoints:
            - SourceVolume: runtime-tmp
              ContainerPath: /tmp
              ReadOnly: false
          Command: [aws-run]
          Environment:
            - {Name: KIWOOM_MODE, Value: demo}
            - {Name: KIWOOM_TOKEN_STORE, Value: memory}
            - {Name: LIVE_ORDER_ENABLED, Value: "0"}
            - {Name: NAT_INSTANCE_ID, Value: !Ref NatInstanceId}
            - {Name: EXPECTED_EGRESS_IP, Value: !Ref ExpectedEgressIp}
            - Name: PAPER_BUCKET
              Value: !Ref ArtifactBucket
            - Name: PAPER_TABLE
              Value: !Ref PaperTable
            - {Name: TRADING_CALENDAR_KEY, Value: "config/calendar/current.json"}
            - Name: STARTING_CASH
              Value: !Ref StartingCash
            - Name: MEDIUM_STARTING_CASH
              Value: !Ref MediumStartingCash
            - Name: DAY_TRADE_STARTING_CASH
              Value: !Ref DayTradeStartingCash
            - Name: BUY_FEE_BPS
              Value: !Ref BuyFeeBps
            - Name: SELL_FEE_BPS
              Value: !Ref SellFeeBps
            - Name: SELL_TAX_BPS
              Value: !Ref SellTaxBps
            - Name: PAPER_WALLET_EPOCH
              Value: !Ref PaperWalletEpoch
            - Name: NOTIFICATION_CHANNEL
              Value: !Ref NotificationChannel
            - Name: NOTIFICATION_SECRET_ARN
              Value: !Ref NotificationSecretArn
            - Name: SNS_NOTIFICATION_TOPIC_ARN
              Value: !Ref TradeNotificationTopic
          Secrets:
            - Name: APP_KEY_MOCK
              ValueFrom: !Sub "${KiwoomDemoSecretArn}:app_key_mock::"
            - Name: APP_SECRET_MOCK
              ValueFrom: !Sub "${KiwoomDemoSecretArn}:app_secret_mock::"
            - Name: DART_API_KEY
              ValueFrom: !Sub "${DartSecretArn}:dart_api_key::"
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: paper

  SchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: stock-paper-app-scheduler
      Path: /stock-paper/
      PermissionsBoundary: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/StockPaperAppSchedulerBoundary"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: scheduler.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: run-paper-task
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ecs:RunTask
                Resource: !Ref TaskDefinition
              - Effect: Allow
                Action: iam:PassRole
                Resource: [!GetAtt ExecutionRole.Arn, !GetAtt TaskRole.Arn]

  ScanSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      State: !Ref CoreScheduleState
      FlexibleTimeWindow: {Mode: "OFF"}
      ScheduleExpression: cron(50 14 ? * MON-FRI *)
      ScheduleExpressionTimezone: Asia/Seoul
      Target:
        Arn: !GetAtt Cluster.Arn
        RoleArn: !GetAtt SchedulerRole.Arn
        RetryPolicy: {MaximumEventAgeInSeconds: 240, MaximumRetryAttempts: 1}
        EcsParameters:
          TaskDefinitionArn: !Ref TaskDefinition
          LaunchType: FARGATE
          NetworkConfiguration:
            AwsvpcConfiguration:
              AssignPublicIp: !Ref AssignPublicIp
              Subnets: !Ref SubnetIds
              SecurityGroups: !Ref SecurityGroupIds
        Input: '{"containerOverrides":[{"name":"stock-automation","environment":[{"name":"RUN_PHASE","value":"SCAN_1450"},{"name":"SCHEDULED_AT","value":"<aws.scheduler.scheduled-time>"}]}]}'

  ShortlistSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      State: !Ref CoreScheduleState
      FlexibleTimeWindow: {Mode: "OFF"}
      ScheduleExpression: cron(10 15 ? * MON-FRI *)
      ScheduleExpressionTimezone: Asia/Seoul
      Target:
        Arn: !GetAtt Cluster.Arn
        RoleArn: !GetAtt SchedulerRole.Arn
        RetryPolicy: {MaximumEventAgeInSeconds: 180, MaximumRetryAttempts: 1}
        EcsParameters:
          TaskDefinitionArn: !Ref TaskDefinition
          LaunchType: FARGATE
          NetworkConfiguration:
            AwsvpcConfiguration:
              AssignPublicIp: !Ref AssignPublicIp
              Subnets: !Ref SubnetIds
              SecurityGroups: !Ref SecurityGroupIds
        Input: '{"containerOverrides":[{"name":"stock-automation","environment":[{"name":"RUN_PHASE","value":"SHORTLIST_1510"},{"name":"SCHEDULED_AT","value":"<aws.scheduler.scheduled-time>"}]}]}'

  EntrySchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      State: !Ref CoreScheduleState
      FlexibleTimeWindow: {Mode: "OFF"}
      ScheduleExpression: cron(20 15 ? * MON-FRI *)
      ScheduleExpressionTimezone: Asia/Seoul
      Target:
        Arn: !GetAtt Cluster.Arn
        RoleArn: !GetAtt SchedulerRole.Arn
        RetryPolicy: {MaximumEventAgeInSeconds: 60, MaximumRetryAttempts: 1}
        EcsParameters:
          TaskDefinitionArn: !Ref TaskDefinition
          LaunchType: FARGATE
          NetworkConfiguration:
            AwsvpcConfiguration:
              AssignPublicIp: !Ref AssignPublicIp
              Subnets: !Ref SubnetIds
              SecurityGroups: !Ref SecurityGroupIds
        Input: '{"containerOverrides":[{"name":"stock-automation","environment":[{"name":"RUN_PHASE","value":"ENTRY_1520"},{"name":"SCHEDULED_AT","value":"<aws.scheduler.scheduled-time>"}]}]}'

  NxtEntrySchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      State: !Ref NxtScheduleState
      FlexibleTimeWindow: {Mode: "OFF"}
      ScheduleExpression: cron(55 19 ? * MON-FRI *)
      ScheduleExpressionTimezone: Asia/Seoul
      Target:
        Arn: !GetAtt Cluster.Arn
        RoleArn: !GetAtt SchedulerRole.Arn
        RetryPolicy: {MaximumEventAgeInSeconds: 60, MaximumRetryAttempts: 1}
        EcsParameters:
          TaskDefinitionArn: !Ref TaskDefinition
          LaunchType: FARGATE
          NetworkConfiguration:
            AwsvpcConfiguration:
              AssignPublicIp: !Ref AssignPublicIp
              Subnets: !Ref SubnetIds
              SecurityGroups: !Ref SecurityGroupIds
        Input: '{"containerOverrides":[{"name":"stock-automation","environment":[{"name":"RUN_PHASE","value":"ENTRY_NXT_1955"},{"name":"SCHEDULED_AT","value":"<aws.scheduler.scheduled-time>"}]}]}'

  EarlyExitReviewSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      State: !Ref CoreScheduleState
      FlexibleTimeWindow: {Mode: "OFF"}
      ScheduleExpression: cron(5 9 ? * MON-FRI *)
      ScheduleExpressionTimezone: Asia/Seoul
      Target:
        Arn: !GetAtt Cluster.Arn
        RoleArn: !GetAtt SchedulerRole.Arn
        RetryPolicy: {MaximumEventAgeInSeconds: 120, MaximumRetryAttempts: 1}
        EcsParameters:
          TaskDefinitionArn: !Ref TaskDefinition
          LaunchType: FARGATE
          NetworkConfiguration:
            AwsvpcConfiguration:
              AssignPublicIp: !Ref AssignPublicIp
              Subnets: !Ref SubnetIds
              SecurityGroups: !Ref SecurityGroupIds
        Input: '{"containerOverrides":[{"name":"stock-automation","environment":[{"name":"RUN_PHASE","value":"EXIT_0905"},{"name":"SCHEDULED_AT","value":"<aws.scheduler.scheduled-time>"}]}]}'

  ScheduledExitSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      State: !Ref CoreScheduleState
      FlexibleTimeWindow: {Mode: "OFF"}
      ScheduleExpression: cron(10 9 ? * MON-FRI *)
      ScheduleExpressionTimezone: Asia/Seoul
      Target:
        Arn: !GetAtt Cluster.Arn
        RoleArn: !GetAtt SchedulerRole.Arn
        RetryPolicy: {MaximumEventAgeInSeconds: 120, MaximumRetryAttempts: 1}
        EcsParameters:
          TaskDefinitionArn: !Ref TaskDefinition
          LaunchType: FARGATE
          NetworkConfiguration:
            AwsvpcConfiguration:
              AssignPublicIp: !Ref AssignPublicIp
              Subnets: !Ref SubnetIds
              SecurityGroups: !Ref SecurityGroupIds
        Input: '{"containerOverrides":[{"name":"stock-automation","environment":[{"name":"RUN_PHASE","value":"EXIT_0910"},{"name":"SCHEDULED_AT","value":"<aws.scheduler.scheduled-time>"}]}]}'

  WeeklyTuningSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      State: !Ref CoreScheduleState
      FlexibleTimeWindow: {Mode: "OFF"}
      ScheduleExpression: cron(0 8 ? * SAT *)
      ScheduleExpressionTimezone: Asia/Seoul
      Target:
        Arn: !GetAtt Cluster.Arn
        RoleArn: !GetAtt SchedulerRole.Arn
        RetryPolicy: {MaximumEventAgeInSeconds: 300, MaximumRetryAttempts: 1}
        EcsParameters:
          TaskDefinitionArn: !Ref TaskDefinition
          LaunchType: FARGATE
          NetworkConfiguration:
            AwsvpcConfiguration:
              AssignPublicIp: !Ref AssignPublicIp
              Subnets: !Ref SubnetIds
              SecurityGroups: !Ref SecurityGroupIds
        Input: '{"containerOverrides":[{"name":"stock-automation","environment":[{"name":"RUN_PHASE","value":"TUNE_WEEKLY"},{"name":"SCHEDULED_AT","value":"<aws.scheduler.scheduled-time>"}]}]}'

  MediumEntrySchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      State: !Ref CoreScheduleState
      FlexibleTimeWindow: {Mode: "OFF"}
      ScheduleExpression: cron(15 9 ? * MON-FRI *)
      ScheduleExpressionTimezone: Asia/Seoul
      Target:
        Arn: !GetAtt Cluster.Arn
        RoleArn: !GetAtt SchedulerRole.Arn
        RetryPolicy: {MaximumEventAgeInSeconds: 120, MaximumRetryAttempts: 1}
        EcsParameters:
          TaskDefinitionArn: !Ref TaskDefinition
          LaunchType: FARGATE
          NetworkConfiguration:
            AwsvpcConfiguration:
              AssignPublicIp: !Ref AssignPublicIp
              Subnets: !Ref SubnetIds
              SecurityGroups: !Ref SecurityGroupIds
        Input: '{"containerOverrides":[{"name":"stock-automation","environment":[{"name":"RUN_PHASE","value":"MEDIUM_ENTRY_0915"},{"name":"SCHEDULED_AT","value":"<aws.scheduler.scheduled-time>"}]}]}'

  MediumSignalSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      State: !Ref CoreScheduleState
      FlexibleTimeWindow: {Mode: "OFF"}
      ScheduleExpression: cron(40 15 ? * MON-FRI *)
      ScheduleExpressionTimezone: Asia/Seoul
      Target:
        Arn: !GetAtt Cluster.Arn
        RoleArn: !GetAtt SchedulerRole.Arn
        RetryPolicy: {MaximumEventAgeInSeconds: 120, MaximumRetryAttempts: 1}
        EcsParameters:
          TaskDefinitionArn: !Ref TaskDefinition
          LaunchType: FARGATE
          NetworkConfiguration:
            AwsvpcConfiguration:
              AssignPublicIp: !Ref AssignPublicIp
              Subnets: !Ref SubnetIds
              SecurityGroups: !Ref SecurityGroupIds
        Input: '{"containerOverrides":[{"name":"stock-automation","environment":[{"name":"RUN_PHASE","value":"MEDIUM_SIGNAL_1540"},{"name":"SCHEDULED_AT","value":"<aws.scheduler.scheduled-time>"}]}]}'

  MediumReviewSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      State: !Ref CoreScheduleState
      FlexibleTimeWindow: {Mode: "OFF"}
      ScheduleExpression: cron(35 15 ? * MON-FRI *)
      ScheduleExpressionTimezone: Asia/Seoul
      Target:
        Arn: !GetAtt Cluster.Arn
        RoleArn: !GetAtt SchedulerRole.Arn
        RetryPolicy: {MaximumEventAgeInSeconds: 120, MaximumRetryAttempts: 1}
        EcsParameters:
          TaskDefinitionArn: !Ref TaskDefinition
          LaunchType: FARGATE
          NetworkConfiguration:
            AwsvpcConfiguration:
              AssignPublicIp: !Ref AssignPublicIp
              Subnets: !Ref SubnetIds
              SecurityGroups: !Ref SecurityGroupIds
        Input: '{"containerOverrides":[{"name":"stock-automation","environment":[{"name":"RUN_PHASE","value":"MEDIUM_REVIEW_1535"},{"name":"SCHEDULED_AT","value":"<aws.scheduler.scheduled-time>"}]}]}'

  EquitySnapshotSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      State: !Ref CoreScheduleState
      FlexibleTimeWindow: {Mode: "OFF"}
      ScheduleExpression: cron(50 15 ? * MON-FRI *)
      ScheduleExpressionTimezone: Asia/Seoul
      Target:
        Arn: !GetAtt Cluster.Arn
        RoleArn: !GetAtt SchedulerRole.Arn
        RetryPolicy: {MaximumEventAgeInSeconds: 180, MaximumRetryAttempts: 1}
        EcsParameters:
          TaskDefinitionArn: !Ref TaskDefinition
          LaunchType: FARGATE
          NetworkConfiguration:
            AwsvpcConfiguration:
              AssignPublicIp: !Ref AssignPublicIp
              Subnets: !Ref SubnetIds
              SecurityGroups: !Ref SecurityGroupIds
        Input: '{"containerOverrides":[{"name":"stock-automation","environment":[{"name":"RUN_PHASE","value":"EQUITY_SNAPSHOT_1550"},{"name":"SCHEDULED_AT","value":"<aws.scheduler.scheduled-time>"}]}]}'

Outputs:
  ArtifactBucketName: {Value: !Ref ArtifactBucket}
  PaperTableName: {Value: !Ref PaperTable}
  ClusterArn: {Value: !GetAtt Cluster.Arn}
  TaskDefinitionArn: {Value: !Ref TaskDefinition}
  NotificationChannel: {Value: !Ref NotificationChannel}
  NotificationTopicArn: {Value: !Ref TradeNotificationTopic}
  LogGroupName: {Value: !Ref LogGroup}
